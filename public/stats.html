<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>统计结果 - 问卷系统</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="container">
    <div class="card">
      <h1>整体问卷统计</h1>
      <input id="surveyId" placeholder="请输入 surveyId" />
      <div class="grid two">
        <button onclick="loadSavedSurveyId()">读取当前问卷ID</button>
        <button onclick="loadSurveyStats()">查看问卷统计</button>
      </div>
      <pre id="surveyStatsRaw"></pre>
    </div>

    <div class="card" style="border: 2px solid #2563eb;">
      <h2>🌍 跨问卷全局统计 (多版本聚合)</h2>
      <p class="small">输入题目的 originalId，查看该题及其所有衍生版本在全站所有问卷中的总体分布。</p>
      <input id="globalOriginalId" placeholder="请输入题目的 originalId" />
      <button class="secondary" onclick="loadGlobalStats()">透视全局数据</button>
      <pre id="globalStatsRaw"></pre>
    </div>

    <div class="card">
      <h2>📊 统计结果展示图谱</h2>
      <div id="statsView"></div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    renderNavbar('stats');
    ensureLoggedIn();

    function loadSavedSurveyId() {
      document.getElementById('surveyId').value = localStorage.getItem('currentSurveyId') || '';
    }

    function renderSurveyStats(data) {
      const container = document.getElementById('statsView');
      if (!data || !data.stats) {
        container.innerHTML = '<p>暂无统计数据</p>';
        return;
      }

      const header = `
        <div class="question-card">
          <h3>${data.survey ? '问卷标题：' + data.survey.title : '全局统计模式'}</h3>
          <div><strong>总涉及答卷数：</strong>${data.survey ? data.survey.totalSubmissions : data.totalInvolvedSurveys}</div>
        </div>
      `;

      // 判断传进来的是数组（整卷统计）还是单个对象（全局单题）
      const statsList = Array.isArray(data.stats) ? data.stats : [data.stats];
      container.innerHTML = header + statsList.map(stat => renderOneStat(stat)).join('');
    }

    function renderOneStat(stat) {
      let content = '';
      if (stat.type === 'single' || stat.type === 'multiple') {
        const options = Object.entries(stat.optionCounts || {}).map(([k, v]) => `<li>${k}：<b>${v}</b> 票</li>`).join('');
        content = `<ul>${options}</ul>`;
      } else if (stat.type === 'text' || stat.type === 'number') {
        const list = (stat.answers || []).slice(0, 10).map(i => `<li>${i}</li>`).join(''); // 最多展示 10 条
        content = `<div>${stat.average ? '平均值：' + stat.average : ''}</div><ul>${list || '<li>无回答</li>'}</ul>`;
      }

      return `
        <div class="question-card">
          <h3>${stat.title}</h3>
          <div class="small">题型：${stat.type} | 有效作答人次：${stat.totalAnswered}</div>
          <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
          ${content}
        </div>
      `;
    }

    async function loadSurveyStats() {
      try {
        const surveyId = document.getElementById('surveyId').value.trim();
        const data = await request(`/api/stats/survey/${surveyId}`, { headers: getAuthHeaders(false) });
        showJson('surveyStatsRaw', data);
        renderSurveyStats(data);
      } catch (err) { alert(err.message); }
    }

    // 新增：调用全局统计 API
    async function loadGlobalStats() {
      try {
        const originalId = document.getElementById('globalOriginalId').value.trim();
        if(!originalId) return alert("请输入 originalId");

        const data = await request(`/api/stats/global/${originalId}`, { headers: getAuthHeaders(false) });
        showJson('globalStatsRaw', data);
        renderSurveyStats(data);
      } catch (err) { alert(err.message); }
    }

    loadSavedSurveyId();
  </script>
</body>
</html>
